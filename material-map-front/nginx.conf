server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /geojson/ {
        try_files $uri =404;
    }

    location /api/geojson/ {
        proxy_pass https://geo.datav.aliyun.com/;
        proxy_set_header Host geo.datav.aliyun.com;
    }

    # Docker Desktop local deployment: forward business APIs to poc4.
    # Change this upstream when deploying outside the developer workstation.
    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
